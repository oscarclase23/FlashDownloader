name: Build and Release

on:
  push:
    tags:
      - 'v*' # Se activa al subir un tag como v1.0, v1.0.0, etc.

jobs:
  # --- JOB 1: ANDROID (APK) ---
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Generamos el APK de Debug
      - name: Build Android APK
        run: ./gradlew :composeApp:assembleDebug

      # ✅ PASO NUEVO: Renombrar el archivo feo a uno bonito
      - name: Rename APK
        run: |
          mv composeApp/build/outputs/apk/debug/composeApp-debug.apk composeApp/build/outputs/apk/debug/FlashDownloader-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          # Ahora subimos el archivo con el nombre nuevo
          path: composeApp/build/outputs/apk/debug/FlashDownloader-Android.apk

  # --- JOB 2: WINDOWS (MSI) ---
  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Generamos el instalador MSI
      - name: Build Windows MSI
        run: ./gradlew :composeApp:packageMsi

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          # La ruta donde el plugin de Compose deja el MSI
          path: composeApp/build/compose/binaries/main/msi/*.msi

  # --- JOB 3: PUBLICAR RELEASE ---
  release:
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-msi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            *.apk
            *.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}