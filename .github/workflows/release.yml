name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # --- JOB 1: ANDROID (APK) ---
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Rename APK
        run: |
          mv composeApp/build/outputs/apk/debug/composeApp-debug.apk composeApp/build/outputs/apk/debug/FlashDownloader-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/debug/FlashDownloader-Android.apk

  # --- JOB 2: WINDOWS (MSI y EXE) ---
  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset -y
          refreshenv

      - name: Build Windows Installers
        shell: cmd
        run: .\gradlew.bat :composeApp:packageMsi :composeApp:packageExe

      # Esto es vital para que el paso de 'release' los encuentre después
      - name: Prepare Windows Artifacts
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          # Mueve cualquier .msi o .exe que haya generado
          Move-Item -Path composeApp\build\compose\binaries\main\msi\*.msi -Destination artifacts\
          Move-Item -Path composeApp\build\compose\binaries\main\exe\*.exe -Destination artifacts\

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: artifacts/*

  # --- JOB 3: PUBLICAR RELEASE ---
  release:
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            *.apk
            *.msi
            *.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}